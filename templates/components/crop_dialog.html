{% from 'components/macros.html' import icon %}
<!-- Crop of a reference photo (static/js/crop_dialog.js) -->
<div class="modal-overlay" id="cropDialog">
    <div class="modal-dialog crop-dialog" role="dialog" aria-modal="true" aria-labelledby="cropDialogTitle">
        <div class="modal-header">
            <h3 class="modal-title" id="cropDialogTitle"></h3>
        </div>
        <div class="modal-body">
            <p class="form-hint crop-hint" id="cropDialogHint"></p>
            <div class="crop-stage" id="cropStage">
                <img id="cropImage" alt="" draggable="false">
                <!-- Darkens what the crop leaves out; clipped to the image, unlike the handles -->
                <div class="crop-shade-clip"><div class="crop-shade" id="cropShade"></div></div>
                <div class="crop-box" id="cropBox" tabindex="0" aria-label="{{ t('crop.box_label') }}">
                    {% for handle in ['nw', 'n', 'ne', 'e', 'se', 's', 'sw', 'w'] %}
                    <span class="crop-handle" data-handle="{{ handle }}"></span>
                    {% endfor %}
                </div>
            </div>
            <label class="toggle-row crop-confirm hidden" id="cropConfirmRow">
                <input type="checkbox" id="cropConfirm">
                <span class="toggle-label" id="cropConfirmText"></span>
            </label>
            <p class="form-hint form-warning hidden" id="cropError" role="alert">{{ icon('alert', 'icon-sm') }}<span></span></p>
        </div>
        <div class="modal-footer crop-footer">
            <button type="button" class="btn btn-ghost btn-small hidden" id="cropAuto">{{ icon('refresh', 'icon-sm') }}<span>{{ t('crop.automatic') }}</span></button>
            <button type="button" class="btn btn-ghost btn-small" id="cropFull">{{ icon('maximize', 'icon-sm') }}<span>{{ t('crop.full') }}</span></button>
            <span class="crop-footer-gap"></span>
            <button type="button" class="btn btn-cancel" id="cropCancel">{{ t('common.cancel') }}</button>
            <button type="button" class="btn btn-primary" id="cropApply">{{ t('crop.apply') }}</button>
        </div>
    </div>
</div>
