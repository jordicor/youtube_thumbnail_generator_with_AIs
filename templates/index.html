{% extends "base.html" %}
{% from 'components/macros.html' import icon %}

{% block title %}{{ t('index.title') }}{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1>{{ t('index.heading') }}</h1>
        <p class="page-subtitle" id="directorySubtitle"></p>
    </div>
    <div class="library-header-actions">
        <div class="directory-selector" id="directorySelector">
            <button type="button" class="directory-current" id="directoryCurrent" aria-haspopup="true" aria-expanded="false">
                {{ icon('folder') }}
                <span class="directory-name" id="directoryName">{{ t('header.select_directory') }}</span>
                {{ icon('chevron-down', 'directory-arrow') }}
            </button>
            <div class="directory-dropdown" id="directoryDropdown">
                <div class="directory-list" id="directoryList">
                    <!-- Directories will be loaded here -->
                </div>
                <div class="directory-add">
                    <input type="text" class="input" id="newDirectoryPath" placeholder="{{ t('header.directory_placeholder') }}">
                    <button type="button" class="btn btn-primary btn-small" id="addDirectoryBtn">{{ icon('plus') }}<span>{{ t('header.add_directory') }}</span></button>
                </div>
            </div>
        </div>
        <button type="button" id="scanBtn" class="btn btn-secondary" disabled>
            {{ icon('refresh') }}<span>{{ t('index.scan_directory') }}</span>
        </button>
    </div>
</div>

<div id="libraryControls" class="hidden">
    <div class="library-controls">
        <div class="search-field">
            {{ icon('search') }}
            <input type="search" class="input" id="videoSearch" placeholder="{{ t('index.search_placeholder') }}" autocomplete="off" maxlength="200">
        </div>
        <label class="library-sort">
            <span>{{ t('index.sort_label') }}</span>
            <select class="select" id="videoSort">
                <option value="recent">{{ t('index.sort.recent') }}</option>
                <option value="activity">{{ t('index.sort.activity') }}</option>
                <option value="name">{{ t('index.sort.name') }}</option>
                <option value="duration">{{ t('index.sort.duration') }}</option>
            </select>
        </label>
    </div>
    <div class="library-controls">
        <div class="filter-chips" id="filterChips"></div>
    </div>
    <div class="results-row">
        <label>
            <input type="checkbox" id="selectPageCheckbox" aria-label="{{ t('index.select_page') }}">
            <span id="resultsSummary"></span>
        </label>
    </div>
</div>

<div class="video-grid" id="videoGrid"></div>

<!-- Pagination -->
<div class="pagination-container hidden" id="paginationContainer">
    <div class="pagination-info">
        <span id="paginationInfo"></span>
    </div>
    <div class="pagination-controls">
        <button type="button" class="pagination-btn" id="firstPageBtn" title="{{ t('pagination.first_page') }}">«</button>
        <button type="button" class="pagination-btn" id="prevPageBtn" title="{{ t('pagination.prev_page') }}">‹</button>
        <div class="pagination-numbers" id="paginationNumbers"></div>
        <button type="button" class="pagination-btn" id="nextPageBtn" title="{{ t('pagination.next_page') }}">›</button>
        <button type="button" class="pagination-btn" id="lastPageBtn" title="{{ t('pagination.last_page') }}">»</button>
    </div>
</div>

<!-- Floating bulk actions, shown while videos are selected -->
<div class="bulk-bar hidden" id="bulkBar" role="region" aria-label="{{ t('index.bulk.region') }}">
    <span class="bulk-count" id="bulkCount"></span>
    <button type="button" class="btn btn-ghost btn-small hidden" id="bulkSelectAll"></button>
    <span class="bulk-divider"></span>
    <button type="button" class="btn btn-primary btn-small" id="bulkAnalyze">{{ icon('play') }}<span>{{ t('index.bulk.analyze') }}</span></button>
    <button type="button" class="btn btn-danger btn-small" id="bulkReanalyze">{{ icon('rotate') }}<span>{{ t('index.card.reanalyze') }}</span></button>
    <button type="button" class="btn btn-secondary btn-small" id="bulkHide">{{ icon('eye-off') }}<span>{{ t('index.bulk.hide') }}</span></button>
    <button type="button" class="icon-btn" id="bulkClear" title="{{ t('index.bulk.clear') }}" aria-label="{{ t('index.bulk.clear') }}">{{ icon('x') }}</button>
</div>

<!-- Video card template -->
<template id="videoCardTemplate">
    <article class="video-card" data-id="">
        <div class="video-thumbnail">
            <label class="video-select" title="{{ t('common.select') }}">
                <input type="checkbox" class="video-checkbox" aria-label="{{ t('common.select') }}">
            </label>
            <img src="" alt="" loading="lazy" onerror="this.src='/static/img/placeholder.svg'">
            <span class="status-pill"></span>
            <span class="video-duration"></span>
            <div class="video-analysis-overlay">
                {{ icon('loader', 'icon-lg icon-spin') }}
                <span class="overlay-text">{{ t('analysis.analyzing') }}</span>
                <span class="overlay-step"></span>
                <div class="overlay-progress"><div class="overlay-progress-fill"></div></div>
            </div>
        </div>
        <div class="video-body">
            <h3 class="video-name"></h3>
            <div class="video-meta"></div>
        </div>
        <div class="video-footer">
            <button type="button" class="btn btn-small video-primary-action"></button>
            <button type="button" class="icon-btn video-more" aria-haspopup="menu" aria-expanded="false"
                    title="{{ t('index.card.more') }}" aria-label="{{ t('index.card.more') }}">{{ icon('more') }}</button>
        </div>
    </article>
</template>

{% endblock %}

{% block scripts %}
<script>
    const PAGE_SIZE = 48;
    const FILTERS = ['all', 'pending', 'processing', 'analyzed', 'completed', 'error', 'hidden'];
    const SORTS = ['recent', 'activity', 'name', 'duration'];
    const LOADING_CARDS = 8;

    const getStatusView = ThumbnailApp.getVideoStatusView;

    // State
    let directories = [];
    let directoriesLoaded = false;
    let currentDirectoryId = null;
    let currentFilter = 'all';
    let currentSort = 'recent';
    let currentSearch = '';
    let currentPage = 1;
    let totalFilteredVideos = 0;
    let filterCounts = null;            // Videos of each library filter, with the search applied
    let pageVideos = new Map();         // id -> video on the current page
    let selectedIds = new Set();        // selected videos of the current page
    let allMatchingSelected = false;    // Gmail-style: every video of the filter, across pages

    // DOM Elements
    const directorySelector = document.getElementById('directorySelector');
    const directoryCurrent = document.getElementById('directoryCurrent');
    const directoryName = document.getElementById('directoryName');
    const directoryList = document.getElementById('directoryList');
    const directorySubtitle = document.getElementById('directorySubtitle');
    const newDirectoryPath = document.getElementById('newDirectoryPath');
    const addDirectoryBtn = document.getElementById('addDirectoryBtn');
    const scanBtn = document.getElementById('scanBtn');
    const libraryControls = document.getElementById('libraryControls');
    const videoSearch = document.getElementById('videoSearch');
    const videoSort = document.getElementById('videoSort');
    const filterChips = document.getElementById('filterChips');
    const resultsSummary = document.getElementById('resultsSummary');
    const selectPageCheckbox = document.getElementById('selectPageCheckbox');
    const videoGrid = document.getElementById('videoGrid');
    const bulkBar = document.getElementById('bulkBar');
    const bulkCount = document.getElementById('bulkCount');
    const bulkSelectAll = document.getElementById('bulkSelectAll');

    // Pagination elements
    const paginationContainer = document.getElementById('paginationContainer');
    const paginationInfo = document.getElementById('paginationInfo');
    const paginationNumbers = document.getElementById('paginationNumbers');
    const firstPageBtn = document.getElementById('firstPageBtn');
    const prevPageBtn = document.getElementById('prevPageBtn');
    const nextPageBtn = document.getElementById('nextPageBtn');
    const lastPageBtn = document.getElementById('lastPageBtn');

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
        const savedDirId = localStorage.getItem('activeDirectoryId');
        if (savedDirId) {
            currentDirectoryId = parseInt(savedDirId);
        }
        const savedFilter = localStorage.getItem('videoStatusFilter');
        if (FILTERS.includes(savedFilter)) {
            currentFilter = savedFilter;
        }
        const savedSort = localStorage.getItem('videoSort');
        if (SORTS.includes(savedSort)) {
            currentSort = savedSort;
        }
        videoSort.value = currentSort;

        // Until the directories arrive: their videos' shape if one was open, else a neutral wait
        if (currentDirectoryId) {
            directoryName.textContent = t('common.loading');
            directorySubtitle.innerHTML = skeletonText(260);
            showLoadingState();
        } else {
            showDirectoriesLoadingState();
        }
        loadDirectories();
        setupDirectorySelector();
        setupScan();
        setupAddDirectory();
        setupControls();
        setupSelection();
        setupPagination();

        // Setup TaskQueue integration for analysis progress tracking
        setupTaskQueueIntegration();
    });

    // ========================================================================
    // DIRECTORY SELECTOR
    // ========================================================================

    function setupDirectorySelector() {
        directoryCurrent.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleDirectoryDropdown();
        });

        // Close on outside click
        document.addEventListener('click', (e) => {
            if (!directorySelector.contains(e.target)) {
                toggleDirectoryDropdown(false);
            }
        });
    }

    function toggleDirectoryDropdown(open = !directorySelector.classList.contains('open')) {
        directorySelector.classList.toggle('open', open);
        directoryCurrent.setAttribute('aria-expanded', String(open));
        if (open && directories.length === 0) {
            newDirectoryPath.focus();
        }
    }

    async function loadDirectories() {
        try {
            const response = await fetch('/api/directories');
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            directories = data.directories;
            directoriesLoaded = true;
            renderDirectoryList();
            // Directories whose path did not answer here moved to an alternative path
            for (const dir of directories.filter(d => d.switched_from)) {
                ThumbnailApp.showToast(t('directory.switched', {name: getDirectoryLabel(dir), path: dir.path}), 'info');
            }

            // If we have a saved directory ID, select it
            if (currentDirectoryId) {
                const dir = directories.find(d => d.id === currentDirectoryId);
                if (dir) {
                    selectDirectory(dir);
                } else {
                    // Saved directory no longer exists
                    clearDirectorySelection();
                }
            }
            if (!currentDirectoryId) showNoDirectoryState();
        } catch (error) {
            console.error('Error loading directories:', error);
            ThumbnailApp.showToast(t('errors.load_directories'), 'error');
            // On the first load nothing else would replace the loading state
            if (!directoriesLoaded) {
                directoryName.textContent = t('header.select_directory');
                directorySubtitle.textContent = '';
                libraryControls.classList.add('hidden');
                videoGrid.innerHTML = `<div class="error">${t('errors.load_directories')}: ${escapeHtml(error.message)}</div>`;
            }
        }
    }

    function getDirectoryLabel(dir) {
        return dir.name || dir.path.split(/[/\\]/).pop();
    }

    function directoryPathsTitle(dir) {
        if (dir.alternative_paths.length === 0) return dir.path;
        return [dir.path, t('directory.alternatives_label') + ':', ...dir.alternative_paths].join('\n');
    }

    function renderDirectoryList() {
        if (directories.length === 0) {
            directoryList.innerHTML = `
                <div class="directory-empty">
                    <p>${t('directory.no_directories')}</p>
                    <p>${t('directory.add_below')}</p>
                </div>
            `;
            return;
        }

        directoryList.innerHTML = directories.map(dir => `
            <div class="directory-item ${dir.id === currentDirectoryId ? 'active' : ''}" data-id="${dir.id}">
                <div class="directory-item-info">
                    <div class="directory-item-name">${escapeHtml(getDirectoryLabel(dir))}</div>
                    <div class="directory-item-path" title="${escapeHtml(directoryPathsTitle(dir))}">${escapeHtml(dir.path)}</div>
                </div>
                <div class="directory-item-meta">
                    <div class="directory-item-count">${t(dir.video_count === 1 ? 'video.count_one' : 'video.count_other', {count: dir.video_count})}</div>
                    <div class="directory-item-time">${escapeHtml(dir.time_ago)}</div>
                </div>
                <button type="button" class="icon-btn directory-item-edit" data-id="${dir.id}"
                        title="${t('directory.edit_title')}" aria-label="${t('directory.edit_title')}">${ThumbnailApp.icon('pencil', 'icon-sm')}</button>
                <button type="button" class="icon-btn directory-item-delete" data-id="${dir.id}"
                        title="${t('directory.delete_title')}" aria-label="${t('directory.delete_title')}">${ThumbnailApp.icon('trash', 'icon-sm')}</button>
            </div>
        `).join('');

        directoryList.querySelectorAll('.directory-item').forEach(item => {
            item.addEventListener('click', (e) => {
                if (e.target.closest('.directory-item-edit, .directory-item-delete')) {
                    return; // Handled by the edit and delete buttons
                }
                const dir = directories.find(d => d.id === parseInt(item.dataset.id));
                selectDirectory(dir);
                toggleDirectoryDropdown(false);
            });
        });

        directoryList.querySelectorAll('.directory-item-delete').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                e.stopPropagation();
                const confirmed = await ThumbnailApp.showModal({
                    title: t('directory.delete_title'),
                    htmlMessage: t('directory.delete_confirm_short') + '<br><br>' + t('directory.delete_videos_remain'),
                    type: 'warning',
                    confirmText: t('common.delete'),
                    cancelText: t('common.cancel')
                });
                if (confirmed) {
                    await deleteDirectory(parseInt(btn.dataset.id));
                }
            });
        });

        directoryList.querySelectorAll('.directory-item-edit').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                toggleDirectoryDropdown(false);
                editDirectory(directories.find(d => d.id === parseInt(btn.dataset.id)));
            });
        });
    }

    function selectDirectory(dir) {
        const changed = currentDirectoryId !== dir.id;
        currentDirectoryId = dir.id;
        localStorage.setItem('activeDirectoryId', dir.id);

        directoryName.textContent = getDirectoryLabel(dir);
        directoryCurrent.title = dir.path;
        scanBtn.disabled = false;
        updateDirectorySubtitle(dir);

        directoryList.querySelectorAll('.directory-item').forEach(item => {
            item.classList.toggle('active', parseInt(item.dataset.id) === dir.id);
        });

        if (changed) {
            currentPage = 1;
            clearSelection();
            showLoadingState();
        }
        loadVideos();
    }

    function clearDirectorySelection() {
        currentDirectoryId = null;
        localStorage.removeItem('activeDirectoryId');
        directoryName.textContent = t('header.select_directory');
        directoryCurrent.title = '';
        directorySubtitle.textContent = '';
        scanBtn.disabled = true;
        libraryControls.classList.add('hidden');
        clearSelection();
    }

    function updateDirectorySubtitle(dir) {
        directorySubtitle.textContent = t('index.subtitle', {
            videos: t(dir.video_count === 1 ? 'video.count_one' : 'video.count_other', {count: dir.video_count}),
            time: dir.time_ago
        });
    }

    async function deleteDirectory(dirId) {
        try {
            const response = await fetch(`/api/directories/${dirId}`, { method: 'DELETE' });
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            if (currentDirectoryId === dirId) {
                clearDirectorySelection();
                showNoDirectoryState();
            }

            await loadDirectories();
            ThumbnailApp.showToast(t('directory.deleted'), 'success');
        } catch (error) {
            console.error('Error deleting directory:', error);
            ThumbnailApp.showToast(t('errors.delete_failed'), 'error');
        }
    }

    // ========================================================================
    // EDIT DIRECTORY
    // ========================================================================

    // Videos named when a new path lacks some; the rest are counted
    const MISSING_VIDEOS_SHOWN = 8;

    /**
     * Ask for a directory's name and path and save them. A new path keeps the
     * directory's videos with their analysis; if some videos are not in it,
     * changing it needs a second confirmation.
     * @param {Object} dir - Directory as listed by /api/directories
     */
    async function editDirectory(dir) {
        let values = { name: dir.name || '', path: dir.path, alternative_paths: dir.alternative_paths };
        // The form reopens with what was typed until it is saved or cancelled
        while ((values = await askDirectoryValues(values))) {
            if (!values.path) {
                ThumbnailApp.showToast(t('errors.enter_directory_path'), 'error');
                continue;
            }
            try {
                let response = await putDirectory(dir.id, values, false);
                if (response.status === 409) {
                    const { detail } = await response.json();
                    if (!await confirmMissingVideos(detail)) continue;
                    response = await putDirectory(dir.id, values, true);
                }
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || `HTTP ${response.status}`);
                }
            } catch (error) {
                console.error('Error updating directory:', error);
                ThumbnailApp.showToast(error.message, 'error');
                continue;
            }

            await loadDirectories();
            ThumbnailApp.showToast(t('directory.updated'), 'success');
            return;
        }
    }

    /**
     * Show the directory form.
     * @param {Object} values - Name, path and alternative_paths the form starts with
     * @returns {Promise<Object|null>} Typed name, path and alternative_paths, null if cancelled
     */
    async function askDirectoryValues(values) {
        const confirmed = ThumbnailApp.showModal({
            title: t('directory.edit_title'),
            htmlMessage: `
                <div class="form-group">
                    <label for="editDirectoryName">${t('directory.name_label')}</label>
                    <input type="text" id="editDirectoryName" autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="editDirectoryPath">${t('directory.path_label')}</label>
                    <input type="text" id="editDirectoryPath" autocomplete="off" spellcheck="false">
                    <span class="form-hint">${t('directory.edit_path_hint')}</span>
                </div>
                <div class="form-group">
                    <label for="editDirectoryAlternatives">${t('directory.alternatives_label')}</label>
                    <textarea class="input directory-alternatives" id="editDirectoryAlternatives"
                              rows="2" spellcheck="false"></textarea>
                    <span class="form-hint">${t('directory.alternatives_hint')}</span>
                </div>
            `,
            confirmText: t('common.save'),
            cancelText: t('common.cancel')
        });
        // The modal's body is in the page as soon as it opens
        const nameInput = document.getElementById('editDirectoryName');
        const pathInput = document.getElementById('editDirectoryPath');
        const alternativesInput = document.getElementById('editDirectoryAlternatives');
        nameInput.value = values.name;
        pathInput.value = values.path;
        alternativesInput.value = values.alternative_paths.join('\n');
        pathInput.focus();

        if (!await confirmed) return null;
        return {
            name: nameInput.value.trim(),
            path: pathInput.value.trim(),
            alternative_paths: alternativesInput.value.split('\n').map(line => line.trim()).filter(Boolean)
        };
    }

    function putDirectory(dirId, values, allowMissingVideos) {
        return fetch(`/api/directories/${dirId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ...values, allow_missing_videos: allowMissingVideos })
        });
    }

    /**
     * Ask whether to change the path although some videos are not in it.
     * @param {Object} detail - 409 detail: missing (paths relative to the directory, visible
     *     videos first), hidden (how many of them are hidden) and total (videos of the directory)
     * @returns {Promise<boolean>} True to change it anyway
     */
    function confirmMissingVideos({ missing, hidden, total }) {
        const names = missing.slice(0, MISSING_VIDEOS_SHOWN)
            .map(path => `<li>${escapeHtml(path)}</li>`).join('');
        const more = missing.length - MISSING_VIDEOS_SHOWN;
        let hiddenNote = '';
        if (hidden === missing.length) {
            hiddenNote = t('directory.missing_videos_all_hidden');
        } else if (hidden > 0) {
            hiddenNote = t('directory.missing_videos_some_hidden', {count: hidden});
        }
        return ThumbnailApp.showModal({
            title: t('directory.missing_videos_title'),
            htmlMessage: `
                <p>${t('directory.missing_videos_message', {missing: missing.length, total})} ${hiddenNote}</p>
                <ul class="missing-videos-list">${names}</ul>
                ${more > 0 ? `<p>${t('directory.missing_videos_more', {count: more})}</p>` : ''}
                <p>${t('directory.missing_videos_confirm')}</p>
            `,
            type: 'warning',
            confirmText: t('directory.change_anyway'),
            cancelText: t('common.back')
        });
    }

    // ========================================================================
    // ADD DIRECTORY
    // ========================================================================

    function setupAddDirectory() {
        addDirectoryBtn.addEventListener('click', addDirectory);
        newDirectoryPath.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                addDirectory();
            }
        });
    }

    async function addDirectory() {
        const path = newDirectoryPath.value.trim();
        if (!path) {
            ThumbnailApp.showToast(t('errors.enter_directory_path'), 'error');
            return;
        }

        addDirectoryBtn.disabled = true;

        try {
            const response = await fetch('/api/directories', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ path: path })
            });

            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.detail || `HTTP ${response.status}`);
            }

            const newDir = await response.json();
            newDirectoryPath.value = '';

            await loadDirectories();
            selectDirectory(directories.find(d => d.id === newDir.id));
            toggleDirectoryDropdown(false);

            // A new directory has never been scanned
            await scanDirectory();

            ThumbnailApp.showToast(t('directory.added'), 'success');
        } catch (error) {
            console.error('Error adding directory:', error);
            ThumbnailApp.showToast(error.message, 'error');
        } finally {
            addDirectoryBtn.disabled = false;
        }
    }

    // ========================================================================
    // SEARCH, SORT AND FILTERS
    // ========================================================================

    function setupControls() {
        const applySearch = ThumbnailApp.debounce(() => {
            const value = videoSearch.value.trim();
            if (value === currentSearch) return;
            currentSearch = value;
            currentPage = 1;
            clearSelection();
            loadVideos();
        }, 300);
        videoSearch.addEventListener('input', applySearch);

        videoSort.addEventListener('change', () => {
            currentSort = videoSort.value;
            localStorage.setItem('videoSort', currentSort);
            currentPage = 1;
            clearSelection();
            loadVideos();
        });
    }

    function setFilter(filter) {
        if (filter === currentFilter) return;
        currentFilter = filter;
        localStorage.setItem('videoStatusFilter', filter);
        currentPage = 1;
        clearSelection();
        loadVideos();
    }

    // Without counts (still loading) each count is a placeholder
    function renderFilterChips(counts) {
        filterChips.innerHTML = FILTERS.map(filter => `
            <button type="button" class="chip ${filter === currentFilter ? 'active' : ''} ${counts?.[filter] === 0 ? 'empty' : ''}"
                    data-filter="${filter}" aria-pressed="${filter === currentFilter}">
                <span>${t('index.filters.' + filter)}</span>
                ${counts ? `<span class="chip-count">${counts[filter]}</span>` : '<span class="chip-count skeleton"></span>'}
            </button>
        `).join('');

        filterChips.querySelectorAll('.chip').forEach(chip => {
            chip.addEventListener('click', () => setFilter(chip.dataset.filter));
        });
    }

    // ========================================================================
    // VIDEOS
    // ========================================================================

    async function loadVideos() {
        const directoryId = currentDirectoryId;
        hidePagination();

        const params = new URLSearchParams({
            status: currentFilter,
            sort: currentSort,
            skip: (currentPage - 1) * PAGE_SIZE,
            limit: PAGE_SIZE
        });
        if (currentSearch) {
            params.set('search', currentSearch);
        }

        try {
            const response = await fetch(`/api/directories/${directoryId}/videos?${params}`);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();

            // A newer directory selection superseded this request
            if (directoryId !== currentDirectoryId) return;

            totalFilteredVideos = data.total;
            filterCounts = data.counts;
            updateDirectorySubtitle(data.directory);
            renderFilterChips(data.counts);
            resultsSummary.textContent = t(data.total === 1 ? 'index.results_one' : 'index.results_other', {count: data.total});

            // The page may have become empty (e.g. after hiding its last videos)
            if (data.videos.length === 0 && currentPage > 1) {
                currentPage = Math.max(1, Math.ceil(data.total / PAGE_SIZE));
                loadVideos();
                return;
            }

            pageVideos = new Map(data.videos.map(v => [v.id, v]));
            // Keep only the selection that is still on this page
            selectedIds = new Set([...selectedIds].filter(id => pageVideos.has(id)));

            if (data.videos.length === 0) {
                renderEmptyState(data.counts);
            } else {
                videoGrid.replaceChildren(...data.videos.map(createVideoCard));
                initializeActiveAnalysisOverlays();
            }

            updateSelectionUI();
            if (totalFilteredVideos > PAGE_SIZE) {
                renderPagination();
            }
        } catch (error) {
            console.error('Error loading videos:', error);

    function createVideoCard(video) {
        const template = document.getElementById('videoCardTemplate');
        const card = template.content.cloneNode(true).querySelector('.video-card');
        const view = getStatusView(video.status);
        const isHiddenView = currentFilter === 'hidden';
        const name = ThumbnailApp.formatVideoName(video.filename);

        card.dataset.id = video.id;
        card.dataset.status = video.status;

        const nameEl = card.querySelector('.video-name');
        nameEl.textContent = name;
        nameEl.title = name;

        const img = card.querySelector('img');
        img.src = `/api/videos/${video.id}/thumbnail`;
        img.alt = name;

        const pill = card.querySelector('.status-pill');
        pill.textContent = t(view.label);
        pill.classList.add(`tone-${view.tone}`);
        if (video.status === 'error' && video.error_message) {
            pill.title = video.error_message;
        }

        const duration = card.querySelector('.video-duration');
        if (video.duration_seconds) {
            duration.textContent = ThumbnailApp.formatDuration(video.duration_seconds);
        } else {
            duration.remove();
        }

        card.querySelector('.video-meta').innerHTML = renderVideoMeta(video, view);

        // Selection
        const checkbox = card.querySelector('.video-checkbox');
        checkbox.checked = allMatchingSelected || selectedIds.has(video.id);
        card.classList.toggle('selected', checkbox.checked);
        checkbox.addEventListener('change', () => toggleVideoSelection(video.id, checkbox.checked));

        // Primary action and the "more" menu
        const primary = card.querySelector('.video-primary-action');
        const moreBtn = card.querySelector('.video-more');
        const openable = view.kind === 'ready';

        if (isHiddenView) {
            setButton(primary, 'eye', t('index.card.show'), 'btn-secondary');
            primary.addEventListener('click', () => showVideo(video.id));
        } else if (view.kind === 'pending') {
            setButton(primary, 'play', t('index.card.analyze'), 'btn-primary');
            primary.addEventListener('click', () => startAnalysis(video.id));
        } else if (view.kind === 'ready') {
            setButton(primary, 'arrow-right', t('index.card.open'), 'btn-secondary');
            primary.addEventListener('click', () => openVideo(video.id));
        } else {
            primary.remove();
        }

        if (view.kind === 'processing') {
            moreBtn.remove();
        } else {
            moreBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                ThumbnailApp.showMenu(moreBtn, buildCardMenu(video, view, isHiddenView));
            });
        }

        if (openable) {
            card.classList.add('openable');
            card.tabIndex = 0;
            card.addEventListener('click', (e) => {
                if (!e.target.closest('button, input, label, a')) {
                    openVideo(video.id);
                }
            });
            card.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && e.target === card) {
                    openVideo(video.id);
                }
            });
        }

        if (view.kind === 'processing') {
            card.classList.add('analyzing');
            card.querySelector('.video-analysis-overlay').classList.add('active');
        }

        return card;
    }

    function setButton(button, iconName, label, variant) {

        button.innerHTML = `${ThumbnailApp.icon(iconName, 'icon-sm')}<span>${escapeHtml(label)}</span>`;

    function renderVideoMeta(video, view) {
        if (view.kind === 'pending') {
            return `<span>${escapeHtml(t(video.status === 'error' ? 'index.card.analysis_failed' : 'index.card.not_analyzed'))}</span>`;
        }
        if (view.kind === 'processing') {
            return `<span>${escapeHtml(t('index.card.analysis_running'))}</span>`;
        }
        const parts = [
            `<span>${ThumbnailApp.icon('users')}${escapeHtml(t(video.person_count === 1 ? 'index.card.persons_one' : 'index.card.persons_other', {count: video.person_count}))}</span>`
        ];
        if (video.thumbnail_count > 0) {
            parts.push(`<span>${ThumbnailApp.icon('image')}${escapeHtml(t(video.thumbnail_count === 1 ? 'index.card.thumbnails_one' : 'index.card.thumbnails_other', {count: video.thumbnail_count}))}</span>`);
        }

    function buildCardMenu(video, view, isHiddenView) {
        const items = [];
        if (view.kind === 'ready') {
            items.push({ label: t('index.card.open'), icon: 'arrow-right', onSelect: () => openVideo(video.id) });
        }
        if (isHiddenView) {
            items.push({ label: t('index.card.show'), icon: 'eye', onSelect: () => showVideo(video.id) });
        } else {
            items.push({ label: t('index.card.hide'), icon: 'eye-off', onSelect: () => hideVideo(video.id) });
        }
        // A video that is generating thumbnails cannot be analyzed again until it ends
        if (view.kind === 'ready' && video.status !== 'generating') {
            items.push({ label: t('index.card.reanalyze'), icon: 'rotate', danger: true, onSelect: () => reanalyzeVideo(video.id) });
        }
        return items;

    function setupPagination() {
        firstPageBtn.addEventListener('click', () => goToPage(1));
        prevPageBtn.addEventListener('click', () => goToPage(currentPage - 1));
        nextPageBtn.addEventListener('click', () => goToPage(currentPage + 1));
        lastPageBtn.addEventListener('click', () => goToPage(getTotalPages()));
    }

    function getTotalPages() {
        return Math.ceil(totalFilteredVideos / PAGE_SIZE);
    }

    function goToPage(page) {
        if (page < 1 || page > getTotalPages()) return;

        // A page-level selection does not travel across pages; a global one does
        if (!allMatchingSelected) {
            clearSelection();
        }

        currentPage = page;
        loadVideos();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderPagination() {
        const totalPages = getTotalPages();
        const startItem = (currentPage - 1) * PAGE_SIZE + 1;
        const endItem = Math.min(currentPage * PAGE_SIZE, totalFilteredVideos);

        paginationInfo.textContent = t('pagination.showing', {start: startItem, end: endItem, total: totalFilteredVideos});

        firstPageBtn.disabled = currentPage === 1;
        prevPageBtn.disabled = currentPage === 1;
        nextPageBtn.disabled = currentPage === totalPages;
        lastPageBtn.disabled = currentPage === totalPages;

        renderPageNumbers(totalPages);
        paginationContainer.classList.remove('hidden');
    }

    function renderPageNumbers(totalPages) {
        paginationNumbers.innerHTML = '';

        let pagesToShow = [];
        if (totalPages <= 7) {
            for (let i = 1; i <= totalPages; i++) {
                pagesToShow.push(i);
            }
        } else if (currentPage <= 4) {
            pagesToShow = [1, 2, 3, 4, 5, '...', totalPages];
        } else if (currentPage >= totalPages - 3) {
            pagesToShow = [1, '...', totalPages - 4, totalPages - 3, totalPages - 2, totalPages - 1, totalPages];
        } else {
            pagesToShow = [1, '...', currentPage - 1, currentPage, currentPage + 1, '...', totalPages];
        }

        pagesToShow.forEach(page => {
            if (page === '...') {
                const ellipsis = document.createElement('span');
                ellipsis.className = 'pagination-ellipsis';
                ellipsis.textContent = '…';
                paginationNumbers.appendChild(ellipsis);
            } else {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `pagination-btn ${page === currentPage ? 'active' : ''}`;
                btn.textContent = page;
                btn.addEventListener('click', () => goToPage(page));
                paginationNumbers.appendChild(btn);
            }
        });
    }

    function hidePagination() {
        paginationContainer.classList.add('hidden');
    }

    function isVideoAnalyzing(videoId) {
        if (!window.TaskQueue?.tasks) return false;

        for (const task of window.TaskQueue.tasks.values()) {
            if (task.type === 'analysis' && task.video_id === videoId) {
                return true;
            }
        }
        return false;
    }

    async function startAnalysis(videoId) {
        if (isVideoAnalyzing(videoId)) {
            ThumbnailApp.showToast(t('errors.already_analyzing'), 'info');
            return;
        }

        updateVideoCardOverlay(videoId, 'analyzing');

        try {
            const response = await fetch(`/api/analysis/${videoId}/start`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({})
            });

            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.detail || `HTTP ${response.status}`);
            }

            // TaskQueue SSE handles progress updates via handleTaskQueueEvent
        } catch (error) {
            updateVideoCardOverlay(videoId, 'idle');
            ThumbnailApp.showToast(t('errors.analysis_failed') + ': ' + error.message, 'error');
            loadVideos();
        }
    }

    /**
     * Show or hide the analysis progress over a video card.
     * @param {number} videoId - Video ID
     * @param {'analyzing'|'idle'} state - Whether the analysis is running
     * @param {string} [stepText] - Current step
     * @param {number} [progress] - Progress percentage
     */
    function updateVideoCardOverlay(videoId, state, stepText = '', progress = 0) {
        const card = videoGrid.querySelector(`.video-card[data-id="${videoId}"]`);
        if (!card) return;

        const overlay = card.querySelector('.video-analysis-overlay');
        const active = state === 'analyzing';
        card.classList.toggle('analyzing', active);
        overlay.classList.toggle('active', active);

        if (active) {
            overlay.querySelector('.overlay-step').textContent = stepText;
            overlay.querySelector('.overlay-progress-fill').style.width = `${progress}%`;
            const pill = card.querySelector('.status-pill');
            pill.textContent = t('video_status.analyzing');
            pill.className = 'status-pill tone-info';
        }
    }

    // ========================================================================
    // TASKQUEUE INTEGRATION
    // ========================================================================

    let _taskQueueRetryCount = 0;
    const _taskQueueMaxRetries = 50;

    // M52: Setup integration with global TaskQueueManager (bounded retry)
    function setupTaskQueueIntegration() {
        if (!window.TaskQueue) {
            _taskQueueRetryCount++;
            if (_taskQueueRetryCount >= _taskQueueMaxRetries) {
                console.warn(`TaskQueue not available after ${_taskQueueMaxRetries} retries (${_taskQueueMaxRetries * 100}ms), giving up`);
                return;
            }
            setTimeout(setupTaskQueueIntegration, 100);
            return;
        }

        window.TaskQueue.subscribe(handleTaskQueueEvent);
        initializeActiveAnalysisOverlays();
    }

    // Show progress on the cards of videos that are being analyzed right now
    function initializeActiveAnalysisOverlays() {
        if (!window.TaskQueue?.tasks) return;

        for (const task of window.TaskQueue.tasks.values()) {
            if (task.type === 'analysis') {
                showAnalysisTask(task);
            }
        }
    }

    // Show on a card what its analysis is doing: in the queue, a step, or stopping
    function showAnalysisTask(task) {
        updateVideoCardOverlay(task.video_id, 'analyzing', window.TaskQueue.stepLabel(task), task.progress || 0);
    }

    // The task queue tells how each task ended (a toast); here the cards follow
    function handleTaskQueueEvent(eventType, data) {
        if (eventType === 'tasks_snapshot') {
            for (const task of data.tasks || []) {
                if (task.type === 'analysis') {
                    showAnalysisTask(task);
                }
            }
            return;
        }

        if (data.type !== 'analysis') return;

        switch (eventType) {
            case 'task_started':
            case 'task_progress':
                showAnalysisTask(data);
                break;

            case 'task_completed':
            case 'task_error':
            case 'task_cancelled':
                loadVideos();
                break;
        }
    }

    function setupSelection() {
        selectPageCheckbox.addEventListener('change', () => {
            if (selectPageCheckbox.checked) {
                selectedIds = new Set(pageVideos.keys());
            } else {
                clearSelection();
            }
            syncCardSelection();
            updateSelectionUI();
        });

        bulkSelectAll.addEventListener('click', () => {
            allMatchingSelected = true;
            selectedIds = new Set(pageVideos.keys());
            syncCardSelection();
            updateSelectionUI();
        });

        document.getElementById('bulkClear').addEventListener('click', () => {
            clearSelection();
            syncCardSelection();
            updateSelectionUI();
        });

        document.getElementById('bulkAnalyze').addEventListener('click', analyzeSelected);
        document.getElementById('bulkReanalyze').addEventListener('click', reanalyzeSelected);
        document.getElementById('bulkHide').addEventListener('click', hideSelected);
    }

    function toggleVideoSelection(videoId, selected) {
        if (selected) {
            selectedIds.add(videoId);
        } else {
            selectedIds.delete(videoId);
            allMatchingSelected = false;
        }
        syncCardSelection();
        updateSelectionUI();
    }

    function syncCardSelection() {
        videoGrid.querySelectorAll('.video-card').forEach(card => {
            const selected = allMatchingSelected || selectedIds.has(parseInt(card.dataset.id));
            card.classList.toggle('selected', selected);
            card.querySelector('.video-checkbox').checked = selected;
        });
    }

    function updateSelectionUI() {
        const pageCount = pageVideos.size;
        const count = allMatchingSelected ? totalFilteredVideos : selectedIds.size;
        const pageFullySelected = pageCount > 0 && selectedIds.size === pageCount;

        bulkBar.classList.toggle('hidden', count === 0);
        videoGrid.classList.toggle('selecting', count > 0);
        bulkCount.textContent = allMatchingSelected
            ? t('selection.selected_all', {count})
            : t('selection.selected_count', {count});

        const offerAll = pageFullySelected && !allMatchingSelected && totalFilteredVideos > pageCount;
        bulkSelectAll.classList.toggle('hidden', !offerAll);
        if (offerAll) {
            bulkSelectAll.textContent = t('selection.select_all_videos', {count: totalFilteredVideos});
        }

        // Hidden videos can only be shown again, one by one
        document.getElementById('bulkHide').classList.toggle('hidden', currentFilter === 'hidden');

        // Analyzing is for videos without analysis; analyzing again is another, destructive action
        const kinds = count > 0 ? selectionKinds() : { pending: false, analyzed: false };
        document.getElementById('bulkAnalyze').classList.toggle('hidden', !kinds.pending);
        document.getElementById('bulkReanalyze').classList.toggle('hidden', !kinds.analyzed);

        selectPageCheckbox.checked = pageFullySelected;
        selectPageCheckbox.indeterminate = selectedIds.size > 0 && !pageFullySelected;
    }

    function clearSelection() {
        selectedIds.clear();
        allMatchingSelected = false;
    }

    /**
     * Whether the selection holds videos without analysis and videos already
     * analyzed. Across pages only the filter counts tell; the hidden filter has
     * no counts by status, so both actions show there and say it themselves
     * when they find nothing to do.
     * @returns {Object} pending and analyzed, booleans
     */
    function selectionKinds() {
        if (!allMatchingSelected) {
            const kinds = [...selectedIds].map(id => getStatusView(pageVideos.get(id).status).kind);
            return { pending: kinds.includes('pending'), analyzed: kinds.includes('ready') };
        }
        if (currentFilter === 'hidden') {
            return { pending: true, analyzed: true };
        }
        if (currentFilter === 'all') {
            return {
                pending: filterCounts.pending + filterCounts.error > 0,
                analyzed: filterCounts.analyzed + filterCounts.completed > 0
            };
        }
        return {
            pending: currentFilter === 'pending' || currentFilter === 'error',
            analyzed: currentFilter === 'analyzed' || currentFilter === 'completed'
        };
    }

    // Every video of the current filter and search, across pages
    async function getAllMatchingVideos() {
        const BATCH = 500;  // API page size limit
        const videos = [];
        let total = Infinity;
        while (videos.length < total) {
            const params = new URLSearchParams({ status: currentFilter, sort: currentSort, skip: videos.length, limit: BATCH });
            if (currentSearch) {
                params.set('search', currentSearch);
            }
            const response = await fetch(`/api/directories/${currentDirectoryId}/videos?${params}`);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            total = data.total;
            if (data.videos.length === 0) break;
            videos.push(...data.videos);
        }
        return videos;
    }

    async function getSelectedVideos() {
        return allMatchingSelected
            ? await getAllMatchingVideos()
            : [...selectedIds].map(id => pageVideos.get(id));
    }

    async function analyzeSelected() {
        let videos;
        try {
            videos = await getSelectedVideos();
        } catch (error) {
            ThumbnailApp.showToast(t('errors.load_videos') + ': ' + error.message, 'error');
            return;
        }

        // Only the videos without analysis: the analyzed ones keep theirs
        const toAnalyze = videos.filter(v => getStatusView(v.status).kind === 'pending').map(v => v.id);
        const analyzed = videos.filter(v => getStatusView(v.status).kind === 'ready').length;

        if (toAnalyze.length === 0) {
            ThumbnailApp.showToast(t('video_analyze.no_videos_in_selection'), 'info');
            return;
        }

        const kept = analyzed > 0 ? '<br><br>' + t('video_analyze.analyzed_kept', {count: analyzed}) : '';
        const confirmed = await ThumbnailApp.showModal({
            title: t('video_analyze.title'),
            htmlMessage: t('video_analyze.message', {count: toAnalyze.length}) + kept,
            type: 'info',
            confirmText: t('analysis.start'),
            cancelText: t('common.cancel')
        });

        if (!confirmed) return;

        for (const videoId of toAnalyze) {
            await startAnalysis(videoId);
        }
        ThumbnailApp.showToast(t('analysis.started_for_count', {count: toAnalyze.length}), 'success');

        clearSelection();
        loadVideos();
    }

    // Analyze again the analyzed videos of the selection: it deletes what they have
    async function reanalyzeSelected() {
        let videos;
        try {
            videos = await getSelectedVideos();
        } catch (error) {
            ThumbnailApp.showToast(t('errors.load_videos') + ': ' + error.message, 'error');
            return;
        }

        const analyzed = videos.filter(v => getStatusView(v.status).kind === 'ready' && v.status !== 'generating');
        if (analyzed.length === 0) {
            ThumbnailApp.showToast(t('video_analyze.reanalyze_none'), 'info');
            return;
        }

        const thumbnails = analyzed.reduce((total, video) => total + video.thumbnail_count, 0);
        const confirmed = await ThumbnailApp.showModal({
            title: t('video_analyze.reanalyze_title'),
            htmlMessage: t('video_analyze.reanalyze_message', {
                count: analyzed.length,
                thumbnails: thumbnailsLabel(thumbnails)
            }),
            type: 'danger',
            confirmText: t('video_analyze.reanalyze_confirm'),
            cancelText: t('common.cancel')
        });

        if (!confirmed) return;

        // Refused videos keep everything: their file is gone or they have a task running
        const refused = [];
        for (const video of analyzed) {
            try {
                await requestReanalysis(video.id);
            } catch (error) {
                refused.push(error.message);
            }
        }

        if (refused.length > 0) {
            ThumbnailApp.showToast(t('video_analyze.reanalyze_refused', {count: refused.length, reason: refused[0]}), 'error');
        }
        if (analyzed.length > refused.length) {
            ThumbnailApp.showToast(t('analysis.started_for_count', {count: analyzed.length - refused.length}), 'success');
        }

        clearSelection();
        loadVideos();
    }

    async function hideSelected() {
        let ids;
        try {
            ids = (await getSelectedVideos()).map(v => v.id);
        } catch (error) {
            ThumbnailApp.showToast(t('errors.load_videos') + ': ' + error.message, 'error');
            return;
        }

        try {
            const response = await fetch('/api/videos/bulk/hide', {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ video_ids: ids })
            });
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            const data = await response.json();
            ThumbnailApp.showToast(t('video_hide.bulk_success', {count: data.count}), 'success', {
                label: t('common.undo'),
                onClick: () => showVideos(ids)
            });

            clearSelection();
            await refreshAfterVisibilityChange();
        } catch (error) {
            ThumbnailApp.showToast(t('errors.hide_failed') + ': ' + error.message, 'error');
        }
    }

    async function showVideos(ids) {
        try {
            for (const id of ids) {
                await setVideoHidden(id, false);
            }
            ThumbnailApp.showToast(t('video_hide.restored'), 'success');
            await refreshAfterVisibilityChange();
        } catch (error) {
            ThumbnailApp.showToast(t('errors.show_failed') + ': ' + error.message, 'error');
        }
    }
</script>
{% endblock %}
